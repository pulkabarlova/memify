[versions]
agp = "9.3.2"
compileSdk = "37"
minSdk = "26"
targetSdk = "35"
javaTarget = "17"
desugarJdkLibs = "2.1.2"
ksp = "2.3.10"
coil = "2.7.0"
firebaseBom = "32.7.0"
coilCompose = "2.6.0"
hiltAndroid = "2.60.1"
hiltNavigationCompose = "1.1.0"
kotlin = "2.3.20"
coreKtx = "1.15.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
kotlinxCollectionsImmutable = "0.3.8"
kotlinxCoroutines = "1.10.2"
lifecycleRuntimeKtx = "2.8.7"
lifecycleViewmodelCompose = "2.6.2"
activityCompose = "1.10.1"
composeBom = "2026.08.00"
navigationCompose = "2.8.9"
playServicesAuth = "21.3.0"
roomRuntime = "2.8.4"
coilBase = "2.6.0"
browser = "1.4.0"
material3 = "1.5.0-alpha27"
coilComposeBase = "2.6.0"
ktor = "2.3.12"
kotlinxSerializationJson = "1.11.0"
androidxSecurityCrypto = "1.1.0"
okhttp = "4.12.0"
vkid = "2.5.1"
vkAndroidSdk = "4.1.0"

[libraries]
build-android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
build-kotlin-compose-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
build-ksp-gradle-plugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
build-hilt-gradle-plugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hiltAndroid" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "roomRuntime" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "roomRuntime" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "roomRuntime" }
coil = { module = "io.coil-kt:coil", version.ref = "coil" }
# firebase-* больше не используются нигде в коде (Firebase полностью убран из проекта),
# но алиасы оставлены в каталоге на случай отката — просто ничего на них не ссылается.
firebase-auth = { module = "com.google.firebase:firebase-auth" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-firestore = { module = "com.google.firebase:firebase-firestore" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coilCompose" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
firebase-storage = { module = "com.google.firebase:firebase-storage" }
google-firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hiltAndroid" }
hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hiltAndroid" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinxCollectionsImmutable" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
play-services-auth = { module = "com.google.android.gms:play-services-auth", version.ref = "playServicesAuth" }
coil-base = { group = "io.coil-kt", name = "coil-base", version.ref = "coilBase" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }
firebase-storage-ktx = { group = "com.google.firebase", name = "firebase-storage-ktx"}
coil-compose-base = { group = "io.coil-kt", name = "coil-compose-base", version.ref = "coilComposeBase" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
# Свой HTTP-клиент к бэку вместо Firebase SDK.
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
# Шифрованное хранилище JWT-токенов вместо того, что раньше делал Firebase Auth SDK сам.
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "androidxSecurityCrypto" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
vkid-core = { module = "com.vk.id:vkid", version.ref = "vkid" }
vkid-onetap-compose = { module = "com.vk.id:onetap-compose", version.ref = "vkid" }
vkid-sdk-support = { module = "com.vk.id:vk-sdk-support", version.ref = "vkid" }
vk-android-sdk-core = { module = "com.vk:android-sdk-core", version.ref = "vkAndroidSdk" }
vk-android-sdk-api = { module = "com.vk:android-sdk-api", version.ref = "vkAndroidSdk" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
